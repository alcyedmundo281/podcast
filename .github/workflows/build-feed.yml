name: build feed

# El feed se reconstruye cuando cambia la fuente. NO hay disparador `release`:
# un evento de release corre sobre el tag, y el entorno `github-pages` sólo
# permite desplegar desde la rama por defecto, de modo que ese run moría
# siempre en `deploy`. El despliegue lo hace el push de podcast.yml, que es
# obligatorio de todos modos para que el episodio aparezca en el feed.
#
# Si cambia un asset sin tocar podcast.yml (p. ej. resubir un máster), hay que
# lanzar el workflow a mano desde `main`: pestaña Actions -> build feed ->
# Run workflow. Es el único caso que ya no se reconstruye solo.
on:
  push:
    branches: [main]
    paths:
      - 'podcast.yml'
      - 'scripts/**'
      - 'docs/cover.jpg'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen: usa exactamente uv.lock. El entorno de CI es el mismo que
      # el local, byte a byte.
      - name: Sincronizar el entorno
        run: uv sync --frozen

      - name: Compilar podcast.yml a feed.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/build_feed.py

      # Puerta de calidad: si el feed no es conforme, no se despliega.
      - name: Validar el feed
        run: uv run python scripts/validate_feed.py docs/feed.xml

      - name: Comprobar el techo de 1 GB de GitHub Pages
        run: |
          size=$(du -sm docs | cut -f1)
          echo "docs/ ocupa ${size} MB"
          if [ "$size" -gt 900 ]; then
            echo "::error::docs/ supera los 900 MB. GitHub Pages corta en 1 GB."
            echo "El audio debe vivir en Releases, nunca en docs/."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
