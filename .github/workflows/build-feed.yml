name: build feed

# El feed se reconstruye cuando cambia la fuente en main.
#
# NO escucha el evento `release`, y es deliberado. Publicar un episodio exige
# siempre dos pasos: crear el release con el MP3, y añadir la entrada en
# podcast.yml. El segundo es el que mete el episodio en el feed, así que el
# run disparado por el release publicaría un feed que todavía no lo contiene:
# trabajo redundante que además falla en `deploy`, porque un evento `release`
# corre sobre el tag y el entorno github-pages solo admite despliegues desde
# la rama por defecto.
#
# Para el único caso que no pasa por podcast.yml —reemplazar el asset de un
# release ya publicado, que cambia su tamaño en bytes— está workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'podcast.yml'
      - 'scripts/**'
      - 'docs/cover.jpg'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen: usa exactamente uv.lock. El entorno de CI es el mismo que
      # el local, byte a byte.
      - name: Sincronizar el entorno
        run: uv sync --frozen

      - name: Compilar podcast.yml a feed.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/build_feed.py

      # Puerta de calidad: si el feed no es conforme, no se despliega.
      - name: Validar el feed
        run: uv run python scripts/validate_feed.py docs/feed.xml

      - name: Comprobar el techo de 1 GB de GitHub Pages
        run: |
          size=$(du -sm docs | cut -f1)
          echo "docs/ ocupa ${size} MB"
          if [ "$size" -gt 900 ]; then
            echo "::error::docs/ supera los 900 MB. GitHub Pages corta en 1 GB."
            echo "El audio debe vivir en Releases, nunca en docs/."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
