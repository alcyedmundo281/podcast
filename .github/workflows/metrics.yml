name: métricas de audiencia

# download_count de la API de releases es acumulativo y GitHub no guarda
# histórico. Esta ejecución diaria construye la serie temporal que GitHub
# no conserva.
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 04:00 en Quito
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Recolectar descargas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/metrics.py

      - name: Guardar la muestra
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics-history.json docs/metrics.json
          git diff --staged --quiet || git commit -m "métricas: muestra $(date -u +%F)"
          git push
