# =============================================================================
#  medsemiotics — fuente única del podcast
# =============================================================================
#  Este archivo es la ÚNICA fuente de verdad. `scripts/build_feed.py` lo compila
#  a docs/feed.xml (RSS 2.0 + iTunes + Podcasting 2.0) y a docs/index.html.
#
#  El audio NO vive en este repositorio: cada episodio es un GitHub Release y el
#  MP3 es un asset de ese release. El script resuelve la URL y el tamaño en bytes
#  del enclosure consultando la API de releases. Ver README.md.
# =============================================================================

show:
  title: "medsemiotics"
  subtitle: "Medicina, datos y semiótica clínica"
  # Descripción del canal. Se publica en <description> y <itunes:summary>.
  description: >-
    Conversaciones y ensayos sonoros sobre medicina interna, razonamiento
    clínico y análisis de datos en salud, producidos desde la plataforma
    académica powersemiotics.com. Cada episodio corresponde a un tema del
    banco de contenidos medsemiotics-db y enlaza con su artículo completo.

  author: "Alcy Edmundo"
  owner_name: "Alcy Edmundo"
  owner_email: "alcyedmundo@gmail.com"
  copyright: "CC BY-SA 4.0"
  language: "es-EC"
  explicit: false
  type: "episodic"          # episodic | serial

  # --- Identidad y rutas -----------------------------------------------------
  # base_url debe terminar en "/". Es la carpeta pública del podcast.
  base_url: "https://powersemiotics.com/podcast/"
  # Sitio al que apunta <link> del canal.
  link: "https://powersemiotics.com/medsemiotics/"
  # Portada: 3000x3000 px, JPG o PNG, < 500 KB. Vive en docs/ (pesa poco).
  image: "cover.jpg"

  # --- Repositorio que aloja el audio en Releases -----------------------------
  audio_repo: "alcyedmundo281/podcast"

  # --- Categorías iTunes (máx. 3; la primera es la principal) -----------------
  categories:
    - "Science"
    - "Health & Fitness > Medicine"
    - "Education"

  keywords:
    - medicina interna
    - razonamiento clínico
    - ciencia de datos en salud
    - semiótica médica
    - POCUS

# =============================================================================
#  Episodios — el más reciente arriba.
# =============================================================================
#  Campos por episodio:
#    slug        (req) identificador estable. NO cambiarlo nunca: forma el GUID.
#    title       (req)
#    description (req) notas del episodio. Admite HTML en <content:encoded>.
#    pub_date    (req) ISO 8601 con zona horaria. -05:00 = Ecuador.
#    tag         (req) tag del GitHub Release que contiene el MP3.
#    audio_file  (req) nombre del asset .mp3 dentro de ese release.
#    duration    (req) HH:MM:SS
#    number      (req) número de episodio
#    season      (opc) por defecto 1
#    topic       (opc) slug del tema en medsemiotics-db
#    source_url  (opc) artículo de medsemiotics que origina el episodio
#    transcript  (opc) ruta relativa a docs/ del archivo de transcripción
#    size_bytes  (opc) sólo necesario en modo --offline; si no, se toma de la API
#    explicit    (opc) hereda del canal
# =============================================================================

episodes:
  - slug: "cirrosis-hepatica"
    number: 7
    season: 1
    title: "Fisiopatología de la cirrosis y falla sistémica"
    pub_date: "2026-09-22T22:00:00-05:00"
    duration: "00:25:04"
    tag: "ep007"
    audio_file: "ep007.mp3"
    topic: "gastroenterologia/cirrosis"
    transcript: "transcripts/ep007.vtt"
    source_url: "https://powersemiotics.com/medsemiotics/gastroenterologia/cirrosis.html"
    description: >-
      Un paciente con cirrosis hepática descompensada llega con ascitis a tensión,
      encefalopatía hepática grado II y oliguria progresiva. A partir de la plataforma
      educativa de cirrosis de medsemiotics, este episodio recorre la cascada
      fisiopatológica que conecta la fibrosis hepática con la falla orgánica sistémica.
      Analizamos cómo la hipertensión portal activa el sistema renina-angiotensina-
      aldosterona y el sistema nervioso simpático para retener sodio y agua, generando
      la paradoja hemodinámica de la cirrosis: vasodilatación esplácnica con
      vasoconstricción renal y cerebral. Explicamos los criterios diagnósticos del
      síndrome hepatorrenal (SHR-AKI: creatinina > 0,3 mg/dL en 48 h o > 50 % en
      7 días, sin respuesta a expansión de volumen con albúmina 1 g/kg por 2 días),
      el papel de la albúmina intravenosa en la prevención de la disfunción circulatoria
      post-paracentesis, y los umbrales de la escala MELD-Na que guían la priorización
      en lista de trasplante. También abordamos el sangrado variceal: la profilaxis
      primaria con betabloqueantes no selectivos (propranolol, carvedilol) y el manejo
      agudo con terlipresina más bandas elásticas, y el papel del TIPS en hemorragia
      refractaria.

  - slug: "hepatitis-viral-aguda"
    number: 6
    season: 1
    title: "Hepatitis viral aguda: sesgos, paradojas y la ausencia de números"
    pub_date: "2026-09-22T17:00:00-05:00"
    duration: "00:29:44"
    tag: "ep006"
    audio_file: "ep006.mp3"
    topic: "gastroenterologia/hepatitis-viral-aguda"
    transcript: "transcripts/ep006.vtt"
    source_url: "https://powersemiotics.com/medsemiotics/post.html?slug=hepatitis-viral-aguda-precision-semiotica"
    description: >-
      Un ayudante de cocina de 26 años acude a urgencias por coluria, acolia,
      ictericia franca y dolor en hipocondrio derecho por distensión de la
      cápsula de Glisson, tras regresar de una zona rural con consumo de agua de
      pozo. A partir del caso HM6001 de medsemiotics, este episodio desentraña
      por qué los signos más intuitivos de la hepatitis viral aguda chocan con la
      estadística clínica. Revisamos la baja sensibilidad visual de la
      ictericia (el 42 % de los médicos no la detecta con bilirrubina en 2,5
      mg/dL) y explicamos por qué los cocientes de verosimilitud de la fiebre,
      la coluria y las transaminasas figuran como «no medidos» o «no medibles»:
      el sesgo de incorporación impide calcular el rendimiento diagnóstico de
      pruebas que forman parte de la propia definición del síndrome. Analizamos
      el patrón de referencia etiológico en la serología, los criterios de
      alarma que dictan el ingreso frente al manejo ambulatorio (INR prolongado,
      encefalopatía por amoníaco e intolerancia oral) y las cuatro acciones
      inmediatas de salud pública ante un manipulador de alimentos.

  - slug: "esclerosis-multiple-neuromielitis-optica"
    number: 5
    season: 1
    title: "Esclerosis múltiple o neuromielitis óptica: por qué confundirlas es peligroso"
    pub_date: "2026-09-22T12:00:00-05:00"
    duration: "00:26:30"
    tag: "ep005"
    audio_file: "ep005.mp3"
    topic: "neurologia/enfermedades_desmielinizantes"
    transcript: "transcripts/ep005.vtt"
    source_url: "https://powersemiotics.com/medsemiotics/neurologia/enfermedades_desmielinizantes.html"
    description: >-
      Una mujer de 27 años acude a urgencias con parestesias ascendentes desde
      el ombligo, nivel sensitivo en T10, signo de Lhermitte y una neuritis óptica
      retrobulbar previa con defecto pupilar aferente relativo (Marcus Gunn) y
      fenómeno de Uhthoff. A partir de un caso clínico socrático de la Cátedra de
      Neurología de la Universidad Central del Ecuador en el Hospital Carlos
      Andrade Marín (HCAM), este episodio desmenuza el diagnóstico diferencial de
      los síndromes desmielinizantes. Recorremos los criterios de McDonald 2017
      —dedos de Dawson perivenulares, diseminación en espacio y tiempo, y bandas
      oligoclonales en LCR— y advertimos sobre la trampa diagnóstica de la
      neuromielitis óptica (NMOSD): una astrocitopatía por anticuerpos anti-AQP4
      donde las terapias de esclerosis múltiple (interferón beta, fingolimod o
      natalizumab) no solo fracasan, sino que desencadenan exacerbaciones
      catastróficas. Analizamos también el manejo agudo con pulsos de
      metilprednisolona y la regla de oro en guardia: solicitar un EMO antes de
      asumir un brote nuevo ante un pseudobrote térmico inducido por infección.

  - slug: "hipertension-arterial-esencial"
    number: 4
    season: 1
    title: "Por qué la hidroclorotiazida gana en hipertensión"
    pub_date: "2026-09-21T00:07:00-05:00"
    duration: "00:28:49"
    tag: "ep004"
    audio_file: "ep004.mp3"
    topic: "cardiologia/hipertension-arterial-esencial"
    transcript: "transcripts/ep004.vtt"
    source_url: "https://github.com/alcyedmundo281/farmacosemiotics/blob/main/selecciones/SEL0024-hipertension-arterial-esencial.yaml"
    description: >-
      En el adulto con hipertensión arterial esencial que inicia monoterapia
      sin indicaciones imperiosas, los cuatro candidatos de la Lista Modelo
      —hidroclorotiazida, amlodipino, enalapril y losartán— empatan en
      mortalidad total. Este episodio recorre el informe de selección SEL0024
      para mostrar dónde se rompe ese empate. En ALLHAT, el antagonista del
      calcio pierde en insuficiencia cardiaca (10,2 % frente a 7,7 %; RR 1,38)
      y el IECA pierde en ictus, insuficiencia cardiaca y enfermedad
      cardiovascular combinada: la tiazida es la única que no pierde en
      ningún desenlace duro, aunque esa evidencia se lea desde clortalidona y
      lisinopril. Después, la paradoja de la tolerancia: pese a la
      hipopotasemia, la hiponatremia y la hiperuricemia, la revisión Cochrane
      muestra menos abandonos por efectos adversos con la tiazida que con el
      IECA (RR 0,73) y que con el amlodipino (RR 0,81). Analizamos por qué el
      amlodipino queda como alternativa donde no hay laboratorio, por qué el
      enalapril sólo pasa al frente ante una indicación imperiosa, y por qué
      el losartán, sin comparación directa y con su evidencia limitada al
      ensayo LIFE frente a atenolol, queda reservado. Cierra con la dosis:
      12,5 a 25 mg al día, porque por encima se gana daño metabólico sin
      ganancia tensional.

  - slug: "paralisis-supranuclear-progresiva"
    number: 3
    season: 1
    title: "Parálisis supranuclear progresiva: cuando la mirada vertical delata al parkinsonismo"
    pub_date: "2026-09-07T22:30:00-05:00"
    duration: "00:21:05"
    tag: "ep003"
    audio_file: "ep003.mp3"
    topic: "neurologia/trastornos-movimiento-2"
    transcript: "transcripts/ep003.vtt"
    source_url: "https://powersemiotics.com/medsemiotics/neurologia/trastornos-movimiento-2.html"
    description: >-
      Un hombre de 68 años consulta por un cuadro acinético-rígido bilateral y
      caídas precoces hacia atrás. A pesar de recibir dosis terapéuticas de
      levodopa, su motor permanece en silencio: el cerebro no responde al
      tratamiento cardinal del Parkinson típico. Basado en el sílabo de
      Neurología de la Universidad Central del Ecuador y en un debate
      socrático del Hospital de Especialidades Carlos Andrade Marín (HCAM), este
      episodio desentraña el diagnóstico diferencial de los parkinsonismos
      atípicos. Analizamos la firma semiológica de la Parálisis Supranuclear
      Progresiva (PSP o síndrome de Steele-Richardson-Olszewski): la pérdida
      temprana de sacadas hacia abajo y parálisis de la mirada vertical con
      preservación oculocefálica, el retrocolis con rigidez axial
      predominante, la disartria espástica precoz y los signos radiológicos
      cardinales en resonancia magnética —el signo del colibrí por atrofia del
      tegmento mesencefálico y las orejas de Mickey Mouse—. Una lección sobre
      por qué el diagnóstico diferencial correcto salva al paciente de ensayos
      terapéuticos inútiles y orienta el soporte temprano en deglución y
      rehabilitación postural.

  - slug: "artritis-psoriasica"
    number: 2
    season: 1
    title: "Artritis psoriásica: por qué la mejor eficacia no va primero"
    pub_date: "2026-09-07T21:00:00-05:00"
    duration: "00:14:02"
    tag: "ep002"
    audio_file: "ep002.mp3"
    topic: "reumatologia/artritis-psoriasica"
    transcript: "transcripts/ep002.vtt"
    source_url: "https://powersemiotics.com/farmacosemiotics/selecciones/SEL0003-artritis-psoriasica.html"
    description: >-
      En el adulto con artritis psoriásica periférica activa, el fármaco con la
      mejor evidencia de eficacia —guselkumab, con ensayo aleatorizado, certeza
      alta, NNT 4 para respuesta articular y NNT 2 para aclaramiento cutáneo a
      las 24 semanas— no es el seleccionado como tratamiento inicial. Este
      episodio recorre la selección terapéutica comparativa en cuatro ejes
      (eficacia, seguridad, conveniencia y costo) entre metotrexato,
      guselkumab, anti-TNF monoclonales e inhibidores de JAK. Analizamos por qué
      la guía manda agotar un csDMARD oral antes de escalar a terapia biológica,
      cómo la presencia de manifestaciones no musculoesqueléticas (psoriasis
      extensa, uveítis o enfermedad inflamatoria intestinal) es lo que realmente
      gobierna la elección del mecanismo de acción en el segundo escalón, y por
      qué los inhibidores de JAK quedan reservados al final de la fila debido a
      las advertencias de seguridad regulatorias.

  - slug: "demencias"
    number: 1
    season: 1
    title: "Demencias: por qué las pistas no rescatan la memoria"
    pub_date: "2026-09-06T09:00:00-05:00"
    duration: "00:17:47"
    tag: "ep001"
    audio_file: "ep001.mp3"
    topic: "neurologia/demencias"
    transcript: "transcripts/ep001.vtt"
    source_url: "https://powersemiotics.com/medsemiotics/neurologia/demencias.html"
    description: >-
      Una profesora jubilada de 74 años repite preguntas, se pierde volviendo
      del mercado y asegura que no le pasa nada. A partir de ese caso
      recorremos el abordaje clínico de las demencias en tres movimientos:
      reunir los datos, cruzar el umbral diagnóstico y actuar. El eje del
      episodio es semiológico: por qué la pista semántica no rescata el
      recuerdo, y por qué esa falla distingue un defecto de consolidación
      hipocampal —el sello de la enfermedad de Alzheimer típica— de un
      problema de recuperación. En el camino, la anosognosia como dato
      clínico, la pérdida de autonomía en las actividades instrumentales como
      frontera entre deterioro leve y mayor, el giro diagnóstico que imponen
      las alucinaciones no amenazantes con parkinsonismo, y por qué los
      antipsicóticos típicos están contraindicados en la demencia por cuerpos
      de Lewy. Cierra con el protocolo mínimo innegociable: laboratorio para
      causas reversibles, resonancia estructural y seguridad física del
      paciente.
